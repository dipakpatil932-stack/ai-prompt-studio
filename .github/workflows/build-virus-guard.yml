name: Build Virus Guard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Virus Guard ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "virus-guard.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: virus-guard.zip not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find android-project -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virus-guard-apk
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
