
name: Build Virus Guard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Virus Guard ZIP
        run: |
          mkdir -p android-project
          unzip -o "virus-guard.zip" -d android-project

      - name: Show Android project
        run: |
          echo "Android project files:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: android-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virus-guard-apk
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Fix KSP CI issue
        working-directory: android-project
    
        run: |
                      - name: Fix KSP CI issue
        working-directory: android-project
        run: |
          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.3.6"/' gradle/libs.versions.toml
      - name: Build APK
        working-directory: android-project
        run: |
          gradle assembleDebug --stacktrace      
