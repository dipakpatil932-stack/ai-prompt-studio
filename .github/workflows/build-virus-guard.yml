
name: Build Virus Guard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Virus Guard ZIP
        run: |
          ZIP_FILE="virus-guard.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: virus-guard.zip not found"
            exit 1
          fi

          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find android-project -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "Error: gradlew not found inside virus-guard.zip"
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virus-guard-apk
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
