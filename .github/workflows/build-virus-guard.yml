      name: Build Virus Guard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Virus Guard ZIP
        run: |
          mkdir -p android-project
          unzip -o virus-guard.zip -d android-project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix KSP CI issue
        run: |
          KSP_FILE=$(find "$PROJECT_DIR" -type f -name "libs.versions.toml" | head -1)

          if [ -n "$KSP_FILE" ]; then
            echo "Found version catalog: $KSP_FILE"
            sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.3.6"/' "$KSP_FILE"
            echo "KSP version check:"
            grep -n "googleDevtoolsKsp" "$KSP_FILE" || true
          else
            echo "libs.versions.toml not found; continuing"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "Building from: $(pwd)"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virus-guard-apk
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
