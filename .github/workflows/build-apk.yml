name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4

  - name: Check AI Prompt Studio ZIP
    run: |
      ZIP_FILE="./ai-prompt-studio.zip"
      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: ai-prompt-studio.zip not found in repository root"
        ls -la
        exit 1
      fi
      echo "Found ZIP: $ZIP_FILE"
      mkdir -p android-project
      unzip -q "$ZIP_FILE" -d android-project

  - name: Find Android project
    run: |
      PROJECT_FILE=$(find android-project -type f -name "settings.gradle.kts" -o -name "settings.gradle" -print -quit)

      if [ -z "$PROJECT_FILE" ]; then
        echo "ERROR: Android Gradle project not found in ZIP"
        find android-project -maxdepth 4 -type f | head -100
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PROJECT_FILE")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project found at: $PROJECT_DIR"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.3.1'

  - name: Build Debug APK
    run: |
      cd "$PROJECT_DIR"

      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon
      else
        gradle assembleDebug --no-daemon
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AI-Prompt-Studio-APK
      path: android-project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
